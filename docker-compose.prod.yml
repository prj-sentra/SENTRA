services:
  caddy:
    image: caddy:2-alpine
    container_name: trading-journal-caddy
    restart: unless-stopped
    environment:
      MT5_SYNC_TOKEN: ${MT5_SYNC_TOKEN:?MT5_SYNC_TOKEN is required}
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:?CADDY_SITE_ADDRESS is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api

  postgres:
    ports: !reset []

  web:
    build:
      args:
        VITE_API_URL: /api
    ports: !reset []

  api:
    environment:
      NODE_ENV: production
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN is required}
      AUTH_THROTTLE_KEY: ${AUTH_THROTTLE_KEY:?AUTH_THROTTLE_KEY is required}
      MT5_CREDENTIAL_ENCRYPTION_KEY: ${MT5_CREDENTIAL_ENCRYPTION_KEY:?MT5_CREDENTIAL_ENCRYPTION_KEY is required}
      MT5_BRIDGE_BASE_URL: ${MT5_BRIDGE_BASE_URL:?MT5_BRIDGE_BASE_URL is required}
      MT5_BRIDGE_TOKEN: ${MT5_BRIDGE_TOKEN:?MT5_BRIDGE_TOKEN is required}
      MT5_BRIDGE_TIMEOUT_MS: ${MT5_BRIDGE_TIMEOUT_MS:-10000}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      TRADE_IMAGE_DIR: ${TRADE_IMAGE_DIR:-/data/trade-images}
    ports: !reset []

volumes:
  caddy-data:
  caddy-config:
