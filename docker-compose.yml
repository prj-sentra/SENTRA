services:
  postgres:
    image: postgres:16-alpine
    container_name: trading-journal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trading_journal}
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading} -d ${POSTGRES_DB:-trading_journal}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: trading-journal-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://trading:trading_dev_password@postgres:5432/trading_journal}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      AUTH_THROTTLE_KEY: ${AUTH_THROTTLE_KEY:-development-only-throttle-key-change-me}
      MT5_CREDENTIAL_ENCRYPTION_KEY: ${MT5_CREDENTIAL_ENCRYPTION_KEY:-}
      MT5_BRIDGE_BASE_URL: ${MT5_BRIDGE_BASE_URL:-}
      MT5_BRIDGE_TOKEN: ${MT5_BRIDGE_TOKEN:-}
      MT5_BRIDGE_TIMEOUT_MS: ${MT5_BRIDGE_TIMEOUT_MS:-10000}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      TRADE_IMAGE_DIR: ${TRADE_IMAGE_DIR:-/data/trade-images}
      WIKI_PATH: ${WIKI_PATH:-/data/wiki}
      WIKI_WRITE_TOKEN: ${WIKI_WRITE_TOKEN:-}
      MT5_SYNC_TOKEN: ${MT5_SYNC_TOKEN:-}
      MT5_ACCOUNT_NUMBER: ${MT5_ACCOUNT_NUMBER:-}
      MT5_READ_ONLY_PASSWORD: ${MT5_READ_ONLY_PASSWORD:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - wiki-data:/data/wiki
      - trade-image-data:/data/trade-images
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    container_name: trading-journal-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  wiki-data:
  trade-image-data:
